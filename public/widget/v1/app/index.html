<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <link rel="stylesheet" href="./widget.css">
</head>
<body>
  <!-- Closed state: just the bubble. The loader keeps the iframe bubble-sized
       until we ask it to grow, so nothing else is visible on the host page. -->
  <button id="bubble" type="button" aria-label="Open chat" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
      <path fill="currentColor" d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/>
    </svg>
  </button>

  <div id="greeting" class="greeting" hidden></div>

  <section id="panel" class="panel" hidden aria-label="Chat window">
    <header class="panel-head">
      <div class="head-text">
        <strong id="head-title">Chat</strong>
        <span id="head-status" class="head-status"></span>
      </div>
      <button id="close" type="button" class="icon-btn" aria-label="Close chat">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/>
        </svg>
      </button>
    </header>

    <div id="body" class="panel-body">
      <!-- Screens are swapped in here by widget.js -->
    </div>

    <footer id="branding" class="branding" hidden>
      Powered by <strong>Pulseem</strong>
    </footer>
  </section>

  <script src="./widget.js"></script>
</body>
</html>
